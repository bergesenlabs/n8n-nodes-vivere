name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # The bergesenlabs org runner linux-1 lacks libatomic1, which the Node
    # binaries setup-node downloads need, and has no sudo to add it, so the job
    # runs in the official Node image on the runner's rootless Docker instead.
    runs-on: [self-hosted, bergesen-big, Linux]
    container: node:lts

    steps:
      - uses: actions/checkout@v6

      # The node has no runtime dependencies and nothing in the dev tooling
      # needs its install scripts to lint and build.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack --dry-run --ignore-scripts
